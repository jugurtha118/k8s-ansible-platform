---
# Socle commun : paquets, durcissement SSH, pare-feu, protection contre les attaques par force brute.

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Désactiver la connexion SSH de root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/10-hardening.conf
    create: true
    mode: "0644"
    regexp: "^PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Redémarrer ssh

- name: Interdire l'authentification SSH par mot de passe
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/10-hardening.conf
    create: true
    mode: "0644"
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Redémarrer ssh

# Garde-fou : on vérifie que la configuration SSH est valide AVANT que le handler redémarre le service
- name: Vérifier la configuration SSH
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# --- Pare-feu (ufw) -------------------------------------------------------
# Important : autoriser SSH AVANT d'activer le pare-feu, sinon on se coupe l'accès.
- name: Autoriser SSH, HTTP et HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_ufw_allowed_ports }}"

# k3s : le trafic entre pods et services (réseaux internes) doit passer, sinon le cluster ne fonctionne pas
- name: Autoriser le trafic interne de Kubernetes (pods et services)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_ip: any
  loop: "{{ common_ufw_k8s_cidrs }}"

- name: Bloquer par défaut le trafic entrant
  community.general.ufw:
    default: deny
    direction: incoming

- name: Autoriser par défaut le trafic sortant
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Activer le pare-feu
  community.general.ufw:
    state: enabled

# --- fail2ban : bannit les adresses qui échouent trop de fois en SSH ------
- name: Activer et démarrer fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: demo
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # jamais moins de pods prêts que demandé pendant une mise à jour
      maxSurge: 1         # un pod supplémentaire à la fois
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: webapp:local   # remplacée par chaque overlay (kustomize)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: webapp-config
          env:
            - name: GIT_SHA
              value: "unknown"
          # Readiness : le pod ne reçoit du trafic que s'il répond
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness : Kubernetes redémarre le conteneur s'il ne répond plus
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
